User nobody
Group nogroup
Port 17888
Listen 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/dev/stdout"
LogLevel Error
PidFile "/tmp/tinyproxy.pid"
MaxClients 32
StartServers 2
MinSpareServers 1
MaxSpareServers 4
ConnectPort 443
DisableViaHeader Yes
Filter "/etc/tinyproxy/google-domains.filter"
FilterURLs No
FilterExtended On
FilterDefaultDeny Yes
