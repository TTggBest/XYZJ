[project]
name = "zhiju-management"
version = "3.0.0-dev.1"
description = "Xiaoyu Zhiju database-driven YouTube operations system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
